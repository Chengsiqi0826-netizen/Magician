<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星星大作战</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #191970, #6a0dad);
    }
    .game {
      width: min(92vw, 650px);
      text-align: center;
    }
    h1 { margin: 8px 0 12px; font-size: clamp(28px, 7vw, 48px); }
    .info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 10px;
      border: 1px solid #ffffff55;
      border-radius: 14px;
      background: #ffffff18;
      backdrop-filter: blur(8px);
      font-size: 18px;
    }
    #board {
      position: relative;
      height: min(58vh, 480px);
      border: 2px solid #ffffff55;
      border-radius: 20px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 30%, #ffffffaa 1px, transparent 2px),
        radial-gradient(circle at 70% 70%, #ffffff88 1px, transparent 2px),
        #09092b;
      background-size: 55px 55px, 90px 90px, auto;
      cursor: crosshair;
    }
    #star {
      position: absolute;
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      font-size: 58px;
      line-height: 64px;
      filter: drop-shadow(0 0 10px gold);
      transition: transform 0.08s;
    }
    #star:active { transform: scale(0.75); }
    #message {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 16px;
      background: #09092bdd;
    }
    #message.hidden { display: none; }
    #message p { margin: 0; font-size: 24px; }
    button.restart {
      border: 0;
      border-radius: 999px;
      padding: 12px 24px;
      color: white;
      background: #ff8c00;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 6px 20px #ff8c0055;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>⭐ 星星大作战</h1>
    <div class="info">
      <span>得分：<strong id="score">0</strong></span>
      <span>剩余：<strong id="time">30</strong> 秒</span>
    </div>
    <div id="board">
      <button id="star" aria-label="点击星星">⭐</button>
      <div id="message">
        <p id="messageText">准备开始！</p>
        <button class="restart" id="start">开始游戏</button>
      </div>
    </div>
  </main>

  <script>
    const board = document.getElementById("board");
    const star = document.getElementById("star");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const message = document.getElementById("message");
    const messageText = document.getElementById("messageText");
    const startButton = document.getElementById("start");

    let score = 0;
    let seconds = 30;
    let timer = null;

    function moveStar() {
      const maxX = board.clientWidth - 64;
      const maxY = board.clientHeight - 64;
      star.style.left = Math.floor(Math.random() * maxX) + "px";
      star.style.top = Math.floor(Math.random() * maxY) + "px";
    }

    function startGame() {
      score = 0;
      seconds = 30;
      scoreText.textContent = score;
      timeText.textContent = seconds;
      message.classList.add("hidden");
      moveStar();

      clearInterval(timer);
      timer = setInterval(() => {
        seconds--;
        timeText.textContent = seconds;
        if (seconds <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      clearInterval(timer);
      messageText.textContent = `游戏结束！你收集了 ${score}颗星星！`;
      startButton.textContent = "再玩一次";
      message.classList.remove("hidden");
    }

    star.addEventListener("click", () => {
      if (message.classList.contains("hidden")) {
        score++;
        scoreText.textContent = score;
        moveStar();
      }
    });

    startButton.addEventListener("click", startGame);
  </script>
</body>
</html>
